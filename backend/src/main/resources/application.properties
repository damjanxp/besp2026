spring.application.name=pki

# Database (Docker - pokrenuti sa: docker compose up -d)
spring.datasource.url=jdbc:postgresql://localhost:5433/pki_db
spring.datasource.username=pki_user
spring.datasource.password=pki_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
app.jwt.secret=pki-super-secret-key-koja-mora-biti-minimalno-512-bita-za-hs512-algoritam-2026!
app.jwt.expiration=900000

# reCAPTCHA
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:6Lc7LPIsAAAAAERY-HADlc9tPa0eOsVTwjZsdGEm}
recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify

# Keystore
app.keystore.dir=keystores/
app.keystore.master-password=${KEYSTORE_MASTER_PASSWORD:change-this-in-production-min32chars}

# Frontend
app.frontend.url=http://localhost:4200

recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:6Lc7LPIsAAAAAERY-HADlc9tPa0eOsVTwjZsdGEm}
