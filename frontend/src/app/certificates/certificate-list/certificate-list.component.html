<div class="list-container">
  <div class="header-row">
    <h2>Upravljanje sertifikatima</h2>
    <button mat-raised-button color="primary" *ngIf="isAdmin" (click)="goToCreate()">
      Kreiraj Root sertifikat
    </button>
  </div>
  <mat-spinner *ngIf="isLoading" diameter="40" class="center-spinner"></mat-spinner>
  <div *ngIf="!isLoading && dataSource.data.length === 0" class="empty-message">
    <mat-icon>description</mat-icon>
    <p>Nema sertifikata</p>
  </div>
  <table mat-table [dataSource]="dataSource" matSort class="full-width" *ngIf="!isLoading && dataSource.data.length > 0">
    <ng-container matColumnDef="serialNumber">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Serijski broj</th>
      <td mat-cell *matCellDef="let cert">{{ formatSerial(cert.serialNumber) }}</td>
    </ng-container>
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Tip</th>
      <td mat-cell *matCellDef="let cert">
        <mat-chip-set>
          <mat-chip [ngClass]="getTypeColor(cert.type)">{{ cert.type }}</mat-chip>
        </mat-chip-set>
      </td>
    </ng-container>
    <ng-container matColumnDef="commonName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Common Name</th>
      <td mat-cell *matCellDef="let cert">{{ cert.commonName }}</td>
    </ng-container>
    <ng-container matColumnDef="validFrom">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Važi od</th>
      <td mat-cell *matCellDef="let cert">{{ cert.validFrom | date:'dd.MM.yyyy' }}</td>
    </ng-container>
    <ng-container matColumnDef="validTo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Važi do</th>
      <td mat-cell *matCellDef="let cert">{{ cert.validTo | date:'dd.MM.yyyy' }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td mat-cell *matCellDef="let cert">
        <mat-chip-set>
          <mat-chip [ngClass]="getStatusColor(cert.status)">{{ cert.status }}</mat-chip>
        </mat-chip-set>
      </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Akcije</th>
      <td mat-cell *matCellDef="let cert" class="actions-cell">
        <button mat-button color="primary" (click)="openDetails(cert)">Detalji</button>
        <button mat-button (click)="downloadCertificate(cert, 'PEM')">Preuzmi</button>
        <button mat-button color="warn" *ngIf="cert.status === 'ACTIVE'" (click)="revokeCertificate(cert)">Povuci</button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator
    *ngIf="!isLoading && dataSource.data.length > 0"
    [pageSizeOptions]="[10, 20, 50]"
    [pageSize]="20"
    showFirstLastButtons>
  </mat-paginator>
</div>
