<div class="forgot-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Resetovanje lozinke</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="email@primer.com">
          <mat-error *ngIf="forgotForm.get('email')?.hasError('required')">Email je obavezan</mat-error>
          <mat-error *ngIf="forgotForm.get('email')?.hasError('email')">Unesite validan email</mat-error>
        </mat-form-field>
        <div class="button-row">
          <button mat-raised-button color="primary" type="submit" class="full-width"
                  [disabled]="forgotForm.invalid || isLoading">
            <mat-spinner *ngIf="isLoading" diameter="20" class="inline-spinner"></mat-spinner>
            <span *ngIf="!isLoading">Posalji link</span>
          </button>
        </div>
      </form>
      <p class="success-message" *ngIf="isSubmitted">{{ message }}</p>
      <p class="login-link">
        Nazad na <a routerLink="/login">prijavu</a>
      </p>
    </mat-card-content>
  </mat-card>
</div>
